server {
 listen 80;
 root /usr/share/nginx/html;
 index index.html;
 include /etc/nginx/mime.types;
 gzip on;
 gzip_types text/css application/javascript application/json application/manifest+json;
 add_header Cache-Control "no-cache" always;
 add_header X-Content-Type-Options "nosniff" always;
 add_header Referrer-Policy "strict-origin-when-cross-origin" always;
 add_header Content-Security-Policy "default-src 'self'; script-src 'self'; worker-src 'self' blob:; connect-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; media-src 'self' data: blob:; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;
 location = /manifest.json { default_type application/manifest+json; }
 location = /bricksmack { return 302 /#bricksmack; }
 location / { try_files $uri $uri/ =404; limit_except GET HEAD OPTIONS { deny all; } }
}
